<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamMural</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eaf3ff;background:#07111f;--line:#213d59;--cyan:#5ee0ff;--muted:#91a7bb}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:280px 1fr;height:100vh}.side{background:#0a1625;border-right:1px solid var(--line);padding:18px;overflow:auto}.brand{font-size:25px;font-weight:900}.brand span{color:var(--cyan)}.me,.meta{color:var(--muted);font-size:12px}.section{margin:20px 0 8px;text-transform:uppercase;letter-spacing:.12em;color:#7891a7;font-size:11px}.nav{width:100%;padding:10px;border:0;border-radius:10px;background:transparent;color:#dbe9f7;text-align:left;cursor:pointer}.nav:hover{background:#142a43}.main{display:grid;grid-template-rows:auto 1fr auto}.top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.btn{background:#15324e;color:#fff;border:1px solid #254b6a;border-radius:9px;padding:8px 11px;text-decoration:none}.messages{overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px}.msg{max-width:80%;padding:12px;background:#10243a;border:1px solid #1d3d5a;border-radius:14px}.mine{align-self:flex-end;background:#0f3c50}.author{font-weight:800;color:var(--cyan);font-size:12px}.composer{padding:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:8px}.composer textarea{border:1px solid #294c69;background:#07111f;color:#fff;border-radius:12px;padding:12px}.send{background:var(--cyan);color:#06111d;border:0;border-radius:12px;font-weight:900;padding:0 18px}.empty{margin:auto;color:var(--muted)}@media(max-width:760px){.app{grid-template-columns:180px 1fr}.side{padding:10px}.msg{max-width:94%}}</style></head><body><div class="app"><aside class="side"><div class="brand">Team<span>Mural</span></div><p class="me">{{me.name}}</p><div class="section">Channels</div>{% for c in channels %}{% if c.kind == 'group' %}<button class="nav" data-channel="{{c.id}}" data-label="# {{c.name}}"># {{c.name}}</button>{% endif %}{% endfor %}<div class="section">Direct messages</div>{% for u in users %}<button class="nav dm" data-user="{{u.id}}" data-label="{{u.name}}">{{u.name}}</button>{% endfor %}{% if me.role == 'admin' %}<div class="section">Administration</div><a class="nav" href="{{url_for('admin_users')}}">Manage users</a>{% endif %}</aside><main class="main"><header class="top"><strong id="title">Choose a conversation</strong><form action="{{url_for('logout')}}" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn">Sign out</button></form></header><section id="messages" class="messages"><div class="empty">Choose a conversation.</div></section><section class="composer"><label class="btn">＋<input id="file" type="file" hidden multiple></label><textarea id="input" maxlength="5000" placeholder="Write a message…"></textarea><button id="send" class="send">Send</button></section></main></div><script>
const CSRF={{csrf_token()|tojson}}, ME={{me.id|tojson}}, LIMIT={{max_upload_mb|tojson}};let current=null,timer=null;
const box=document.getElementById('messages'),input=document.getElementById('input');
async function api(url,opts){opts=opts||{};opts.headers=Object.assign({},opts.headers||{},{"X-CSRF-Token":CSRF});const r=await fetch(url,opts);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
function addText(parent,text,cls){const e=document.createElement('div');if(cls)e.className=cls;e.textContent=text;parent.appendChild(e)}
function render(rows){box.replaceChildren();if(!rows.length){addText(box,"No messages yet.","empty");return}rows.forEach(m=>{const a=document.createElement('article');a.className="msg"+(m.user_id===ME?" mine":"");if(m.user_id!==ME)addText(a,m.author,"author");if(m.kind==="text"){addText(a,m.body)}else{let el;if(m.kind==="image"){el=document.createElement("img");el.style.maxWidth="100%";el.src="/media/"+encodeURIComponent(m.stored_name);el.alt=m.original_name||"image"}else if(m.kind==="video"){el=document.createElement("video");el.controls=true;el.src="/media/"+encodeURIComponent(m.stored_name)}else if(m.kind==="audio"){el=document.createElement("audio");el.controls=true;el.src="/media/"+encodeURIComponent(m.stored_name)}else{el=document.createElement("a");el.href="/download/"+encodeURIComponent(m.stored_name);el.textContent="📎 "+(m.original_name||"Attachment");el.style.color="white"}a.appendChild(el)}addText(a,m.created_at,"meta");box.appendChild(a)});box.scrollTop=box.scrollHeight}
async function load(){if(current)render(await api("/api/messages/"+current))}
async function openChannel(id,label){current=Number(id);document.getElementById("title").textContent=label;await load();clearInterval(timer);timer=setInterval(load,3000)}
document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>openChannel(b.dataset.channel,b.dataset.label));
document.querySelectorAll(".dm").forEach(b=>b.onclick=async()=>{const d=await api("/api/direct/"+b.dataset.user,{method:"POST"});openChannel(d.channel_id,b.dataset.label)});
document.getElementById("send").onclick=async()=>{const body=input.value.trim();if(!current||!body)return;await api("/api/messages/"+current,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({body:body})});input.value="";await load()};
document.getElementById("file").onchange=async e=>{if(!current)return;for(const f of Array.from(e.target.files)){if(f.size>LIMIT*1024*1024){alert(f.name+" exceeds upload limit");continue}const fd=new FormData();fd.append("file",f);await api("/api/upload/"+current,{method:"POST",body:fd})}e.target.value="";await load()};
const first=document.querySelector("[data-channel]");if(first)openChannel(first.dataset.channel,first.dataset.label);
</script></body></html>
