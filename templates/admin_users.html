<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamMural · Users</title><style>body{font-family:Inter,system-ui;margin:0;background:#f5f7fa;color:#132238}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dfe7ef;border-radius:18px;padding:22px;margin-bottom:18px}input,select{padding:10px;border:1px solid #c9d5e1;border-radius:9px;margin:4px}button,a{padding:10px 14px;border:0;border-radius:9px;background:#0a6ee8;color:#fff;text-decoration:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e9eef4;padding:10px}</style></head><body><div class="wrap"><p><a href="{{url_for('home')}}">← Back</a></p><div class="card"><h1>Workspace users</h1>{% if error %}<p>{{error}}</p>{% endif %}{% if success %}<p>{{success}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="12" placeholder="Temporary password" required><select name="role"><option value="member">Member</option><option value="admin">Admin</option></select><button>Create user</button></form></div><div class="card"><table><tr><th>Name</th><th>Email</th><th>Role</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td></tr>{% endfor %}</table></div></div></body></html>
