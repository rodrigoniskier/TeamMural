<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamMural · Sign in</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#ecf4ff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#173f68 0,transparent 35%),#07111f}.card{width:min(430px,92vw);padding:34px;border:1px solid #23405e;border-radius:24px;background:#0b1727;box-shadow:0 24px 80px #0008}.eyebrow{color:#64d9ff;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}h1{font-size:42px;margin:12px 0 6px}.muted{color:#9fb2c7;margin-bottom:26px}label{display:block;margin:16px 0 7px;color:#cfe2f5;font-weight:700}input{width:100%;padding:13px;border-radius:12px;border:1px solid #294967;background:#07111f;color:#fff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:#5ee0ff;color:#06111d;font-weight:900}.error{background:#4a1522;color:#ffd9e1;padding:11px;border-radius:10px}</style></head><body><main class="card"><div class="eyebrow">Internal communication</div><h1>TeamMural</h1><div class="muted">A private communication hub for small teams.</div>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></main></body></html>
