<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamMural · Comunicação da equipe</title><link rel="icon" href="/static/favicon.svg"><style>*{box-sizing:border-box}body{font:16px/1.6 Arial,sans-serif;background:#f4f7fb;color:#193653;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(480px,92vw);background:white;border:1px solid #dce4ee;border-radius:14px;padding:38px}h1{font-size:43px;letter-spacing:-2px;line-height:1.15;margin:12px 0}h1 span{color:#245edb}.eyebrow{font-size:12px;letter-spacing:.12em;color:#637a95;text-transform:uppercase}.muted{color:#61758b}button{width:100%;padding:15px;background:#245edb;color:white;border:0;border-radius:8px;font:600 16px Arial;cursor:pointer;margin-top:18px}label{display:block;margin:12px 0 5px}input{width:100%;padding:13px;border:1px solid #ccd8e5;border-radius:7px}.badge{border-top:1px solid #e1e7ee;margin-top:28px;padding-top:20px;font-size:12px;color:#61758b}</style></head><body><main class="card"><p class="eyebrow">Comunicação interna</p><h1>Team<span>Mural</span></h1><p class="muted">Conversas que organizam o trabalho. Um espaço para a equipe, os alinhamentos e os próximos passos.</p>{% if portfolio_demo %}<form method="post" action="/demo/enter"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Explorar a equipe Aurora →</button></form><p class="badge">Demonstração — dados sintéticos<br>7 membros · Canal geral · Conversas individuais</p>{% else %}{% if error %}<p>{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label for="email">Email</label><input id="email" name="email" type="email" required><label for="password">Senha</label><input id="password" name="password" type="password" required><button>Entrar</button></form>{% endif %}</main></body></html>
